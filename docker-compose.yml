services:
  api:
    build: ./backend
    ports: ["8000:8080"]
    command: sh -c "python scripts/seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8080"
    environment:
      APP_ENV: local
      AUTH_MODE: mock
      AUDIT_LOG_PATH: /app/data/audit.jsonl
    volumes:
      - ./data:/app/data
  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_DEMO_AUTH: "true"
    volumes:
      - ./frontend:/web
      - /web/node_modules
